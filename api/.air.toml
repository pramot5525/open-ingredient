root = "."
tmp_dir = "tmp"

[build]
  cmd            = "go build -o ./tmp/server ./cmd/server"
  bin            = "./tmp/server"
  delay          = 1000
  exclude_dir    = ["tmp", "docs"]
  include_ext    = ["go", "toml", "env"]
  stop_on_error  = true
  kill_delay     = "200ms"
  log            = "tmp/build-errors.log"
  poll           = true
  poll_interval  = 500

[log]
  time = true

[screen]
  clear_on_rebuild = true
  keep_scroll      = true
